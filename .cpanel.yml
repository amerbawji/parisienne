---
deployment:
  tasks:
    - export DEPLOYPATH=/home/grillpar/public_html/

    # Keep a one-time copy of whatever .htaccess was there before our first deploy
    - /bin/cp -n ${DEPLOYPATH}.htaccess ${DEPLOYPATH}.htaccess.pre-deploy 2>/dev/null || true

    # dist/ is built locally and committed (cPanel only copies, it doesn't build).
    # dist/. rather than dist/* so hidden files like .htaccess are copied too.
    - /bin/cp -R dist/. $DEPLOYPATH
